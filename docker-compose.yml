services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: fire_mqtt_broker
    ports:
      - "1883:1883"
    volumes:
      - ./deployment/mosquitto/config:/mosquitto/config
      - ./deployment/mosquitto/data:/mosquitto/data
      - ./deployment/mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - fire_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fire_fastapi_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - fire_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_WS_URL: none
    container_name: fire_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fire_network

networks:
  fire_network:
    name: fire_iot_network
    driver: bridge
